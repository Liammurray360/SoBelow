<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shows | So Below Entertainment</title>

<meta name="description" content="Upcoming So Below Entertainment shows including alternative, rock and metal events in Johannesburg.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://sobelow.co.za/shows.html">
<meta property="og:title" content="Shows | So Below Entertainment">
<meta property="og:description" content="Upcoming alternative, rock and metal shows in Johannesburg.">
<meta property="og:image" content="https://sobelow.co.za/sotnvi_Final.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="stylesheet" href="sobelow.css">

<style>
body { background: #f5f5f5; color: #111; }

.page { padding: 140px 8% 70px; }

.page h1 {
  font-size: clamp(2.8rem, 6vw, 5rem);
  margin: 0 0 30px;
  line-height: 0.95;
}

.show-grid { display: grid; gap: 34px; }

.show-card {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  background: white;
  border-radius: 26px;
  padding: 24px;
  border: 1px solid #e6e6e6;
  box-shadow: 0 14px 40px rgba(0,0,0,0.06);
  scroll-margin-top: 90px;
}

.poster-link { display: block; overflow: hidden; border-radius: 18px; }

.poster { width: 100%; border-radius: 18px; transition: 0.3s ease; display: block; }
.poster-link:hover .poster { transform: scale(1.04); }

.show-content { display: flex; flex-direction: column; justify-content: center; }

.date {
  color: #d51616;
  font-weight: 900;
  text-transform: uppercase;
  font-size: 0.82rem;
  letter-spacing: 0.08em;
}

.show-content h2 {
  margin: 10px 0;
  font-size: clamp(1.8rem, 4vw, 3rem);
  line-height: 0.98;
}

.hype {
  color: #d51616;
  font-weight: 900;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.description { color: #444; line-height: 1.6; }

.lineup { margin: 18px 0; }
.lineup strong { display: block; margin-bottom: 8px; }

.lineup span,
.lineup a {
  display: inline-block;
  margin: 4px;
  padding: 6px 10px;
  border-radius: 999px;
  background: #eee;
  text-decoration: none;
  color: #111;
  transition: 0.2s ease;
}

.lineup a:hover { background: #d51616; color: white; }

.ticket-box {
  margin: 16px 0;
  padding: 14px;
  border-radius: 16px;
  background: #f5f5f5;
}

.ticket-box p { margin: 6px 0; }
.ticket-box strong { color: #d51616; }

.button {
  padding: 12px 18px;
  border-radius: 999px;
  background: #d51616;
  color: white;
  text-decoration: none;
  display: inline-block;
  margin-top: 10px;
  transition: 0.2s ease;
  font-weight: 800;
  text-align: center;
}

.button:hover { transform: translateY(-2px); }

.small-grid {
  margin-top: 50px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 26px;
}

.small-card {
  background: white;
  border-radius: 22px;
  padding: 22px;
  border: 1px solid #e6e6e6;
  box-shadow: 0 10px 26px rgba(0,0,0,0.045);
}

.small-card img { width: 100%; border-radius: 14px; transition: 0.3s ease; display: block; }
.small-card img:hover { transform: scale(1.04); }
.small-card h3 { margin: 16px 0 8px; font-size: 1.5rem; }
.small-card p { color: #555; line-height: 1.5; margin: 0; }

@media (max-width: 900px) {
  .page { padding: 35px 5% 50px; }
  .show-card { grid-template-columns: 1fr; padding: 16px; }
  .small-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header class="nav">
  <a class="brand" href="index.html">
    <span class="so">SO BELOW</span>
    <span class="ent">ENTERTAINMENT</span>
  </a>
  <nav>
    <a href="shows.html" class="active">Shows</a>
    <a href="past-shows.html">Past Shows</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="page">

  <h1>Shows</h1>

  <section class="show-grid">


  </section>

  <section class="small-grid">

    <div class="small-card">
      <a href="JamNight.png" target="_blank">
        <img src="JamNight.png" alt="Jam Night poster">
      </a>
      <h3>Jam Night</h3>
      <p>Every Wednesday • Free</p>
    </div>

    <div class="small-card">
      <a href="27_AUG_KARAOKE.png" target="_blank">
        <img src="27_AUG_KARAOKE.png" alt="Alternative Karaoke 27 August poster">
      </a>
      <h3>Alternative Karaoke</h3>
      <p>27 August • Rumours Lounge • Free Entrance • Doors 7PM</p>
    </div>

  </section>

</main>

<footer class="footer">
  <div class="footer-copy">A division of Secret Sauce</div>
</footer>

</body>
</html>
